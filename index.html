<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>SUMI v9.2.6 — Material-First Tray</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100dvh;background:#070b12;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:none;
  font-family:'Share Tech Mono','IBM Plex Mono',monospace}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#build{position:fixed;top:6px;left:8px;font-size:9px;letter-spacing:0.12em;
  color:rgba(87,242,161,0.35);z-index:20;pointer-events:none}
#bstate{position:fixed;top:8px;right:10px;display:flex;gap:5px;z-index:20;pointer-events:none}
.bbar{width:6px;height:42px;border-radius:3px;background:rgba(255,255,255,0.06);
  overflow:hidden;position:relative}
.bbar .fill{position:absolute;left:0;right:0;bottom:0;border-radius:3px;
  transition:height 0.15s}
#barW .fill{background:rgba(120,180,220,0.55)}
#barP .fill{background:rgba(200,180,160,0.55)}
.bbar-label{font-size:7px;color:rgba(255,255,255,0.2);text-align:center;margin-top:2px}
#trayTab{position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  z-index:11;padding:5px 20px 6px;
  background:rgba(7,11,18,0.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:10px 10px 0 0;border:1px solid rgba(87,242,161,0.15);border-bottom:none;
  color:rgba(87,242,161,0.5);font-size:12px;letter-spacing:0.15em;
  font-family:'IBM Plex Mono','Share Tech Mono',monospace;
  touch-action:none;cursor:pointer}
#tray{position:fixed;left:0;right:0;bottom:0;
  padding:11px 14px calc(18px + env(safe-area-inset-bottom));
  background:rgba(7,11,18,0.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(87,242,161,0.08);
  display:flex;flex-direction:column;gap:9px;
  transform:translateY(100%);
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);
  z-index:10;touch-action:none}
#tray.visible{transform:translateY(0)}
#disperseToggle{width:30px;height:30px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(87,242,161,0.3);font-size:10px;color:rgba(87,242,161,0.5);
  transition:transform 0.16s,border-color 0.16s,background 0.16s;touch-action:none;cursor:pointer}
#disperseToggle.off{border-color:rgba(216,100,80,0.4);color:rgba(216,100,80,0.6);background:rgba(120,50,40,0.12)}
#grab{position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:36px;height:3px;border-radius:2px;background:rgba(87,242,161,0.18)}
#swatchRow{display:flex;gap:7px;overflow-x:auto;padding:2px 0 1px;align-items:center;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
#swatchRow::-webkit-scrollbar{display:none}
.swatch{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(255,255,255,0.12);
  transition:transform 0.16s,border-color 0.16s}
.swatch.active{border-color:rgba(87,242,161,0.7);transform:scale(1.18)}
.rowDiv{width:1px;align-self:stretch;margin:2px 5px;background:rgba(170,170,170,0.08);flex-shrink:0}
.size{width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,0.1);transition:transform 0.16s,border-color 0.16s;touch-action:none}
.size i{display:block;border-radius:50%;background:rgba(236,229,210,0.4)}
.size.active{border-color:rgba(87,242,161,0.6);transform:scale(1.1)}
.size.active i{background:rgba(236,229,210,0.7)}
#jsonBtn,#snapBtn{width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(87,242,161,0.35);background:rgba(7,11,18,0.4);
  color:rgba(87,242,161,0.6);font-size:15px;line-height:1;
  transition:transform 0.16s;touch-action:none}
#jsonBtn:active,#snapBtn:active{transform:scale(0.88);border-color:rgba(87,242,161,0.7)}
#resetBtn{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(216,100,80,0.35);background:rgba(120,50,40,0.12);
  color:rgba(236,229,210,0.5);font-size:15px;line-height:1;
  transition:transform 0.16s;touch-action:none}
#resetBtn:active{transform:scale(0.88);background:rgba(120,50,40,0.3)}
.bstyle{width:30px;height:30px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,0.1);font-size:13px;color:rgba(236,229,210,0.45);
  transition:transform 0.16s,border-color 0.16s;touch-action:none}
.bstyle.active{border-color:rgba(87,242,161,0.6);transform:scale(1.1);color:rgba(236,229,210,0.85)}
#brushRow{display:flex;gap:8px;justify-content:center;align-items:center;padding:0 4px;flex-wrap:nowrap}
#brushModes{display:flex;flex:1 1 auto;min-width:0;gap:clamp(3px,1vw,6px);align-items:center}
#brushTools{display:flex;flex:0 0 auto;gap:clamp(3px,1vw,6px);align-items:center}
#brushModes .bstyle{flex:1 1 0;min-width:0}
#brushTools .size{flex:0 0 30px}
#brushTools #disperseToggle,#brushTools #charToggle,#brushTools #flickToggle{flex:0 0 30px;min-width:30px}
@media(max-width:360px){#brushRow{gap:4px;padding:0}#brushTools{gap:3px}#brushTools .size{flex-basis:27px;width:27px;height:27px}#brushTools #disperseToggle,#brushTools #charToggle,#brushTools #flickToggle{flex-basis:27px;min-width:27px;width:27px;height:27px}#brushModes{gap:3px}}
#charRow{display:none;gap:18px;align-items:center;padding:2px 2px 0;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
#charRow.open{display:flex}
#charRow::-webkit-scrollbar{display:none}
.chr{display:flex;flex-direction:column;gap:2px;flex:1 0 82px;min-width:82px}
.chr label{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10px;letter-spacing:0.08em;color:#e8f3ec;text-transform:uppercase;font-weight:600}
.chr label b{font-weight:700;color:#7dfcb4;font-size:11px}
/* v7: live value riding the brush state. Thumb = your ceiling/gain, amber fill = what the brush is doing right now. */
.chr label{white-space:nowrap;gap:3px}
.chr{flex:1 0 104px;min-width:104px}
.chr label .lv{font-weight:700;color:#ffd27a;font-size:11px;margin-left:auto}
.chr label .lv::after{content:'/';color:rgba(236,234,210,.55);margin-left:2px}
.chr.nolive label .lv{display:none}
.chrDiv{width:1px;align-self:stretch;margin:2px 2px;background:rgba(236,234,210,.18);flex-shrink:0}
.chr input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;
  background:transparent;touch-action:none;margin:0}
.chr input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#ffd27a 0,#ffd27a var(--live,0%),rgba(236,234,210,0.22) var(--live,0%))}
.chr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;background:#7dfcb4;margin-top:-8px;
  border:2px solid #0b1012;box-shadow:0 1px 5px rgba(0,0,0,.6)}
.chr input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#ffd27a 0,#ffd27a var(--live,0%),rgba(236,234,210,0.22) var(--live,0%))}
.chr input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
  background:#7dfcb4;border:2px solid #0b1012}
#charToggle{width:30px;height:30px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,0.1);font-size:13px;color:rgba(236,229,210,0.45);
  transition:transform 0.16s,border-color 0.16s;touch-action:none;cursor:pointer}
#charToggle.on{border-color:#7dfcb4;color:#7dfcb4;transform:scale(1.1)}
#tiltToggle{width:30px;height:30px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,0.1);font-size:13px;color:rgba(236,229,210,0.45);
  transition:transform 0.16s,border-color 0.16s;touch-action:none;cursor:pointer}
#tiltToggle.on{border-color:#ffd27a;color:#ffd27a;transform:scale(1.1)}
#tiltToggle.waiting{border-color:rgba(255,210,122,0.35);color:rgba(255,210,122,0.5)}
/* Tilt permission gate. iOS only hands out motion access from inside a real
   click on a real button, so it gets its own screen at boot like SPLAT's. */
#permGate{position:fixed;inset:0;z-index:80;background:rgba(18,20,20,0.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px;text-align:center}
#permGate .g{font-size:30px;color:#7dfcb4;letter-spacing:.06em}
#permGate p{color:#ece6d2;font-size:14px;line-height:2.7;max-width:300px;margin:0}
#permGate button{font-family:inherit;font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  padding:14px 30px;border-radius:5px;cursor:pointer;background:transparent;border:2px solid #7dfcb4;color:#7dfcb4}
#permGate button.skip{border-color:rgba(236,230,210,0.3);color:rgba(236,230,210,0.6);font-size:12px;padding:10px 22px}
#permStatus{font-size:12px;color:#ffd27a;min-height:16px;margin:0}
#dipRow{display:flex;gap:8px;height:64px}
.dip,#napkin{flex:1;border-radius:6px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:0.52rem;letter-spacing:0.12em;text-transform:uppercase;
  touch-action:none;-webkit-user-select:none;cursor:pointer}
.dip .fill{position:absolute;left:0;bottom:0;right:0;height:0%;transition:none}
.dip span,#napkin .napLabel{position:relative;z-index:2;pointer-events:none}
#dipInk{background:#141210;color:rgba(236,229,210,0.6)}
#dipInk .fill{background:rgba(236,229,210,0.12)}
#dipWater{background:#1a3048;color:rgba(180,210,240,0.6)}
#dipWater .fill{background:rgba(120,180,220,0.2)}
#napkin{background:rgba(236,229,210,0.12);color:rgba(236,229,210,0.4);flex:1.4}
#napCanvas{position:absolute;inset:0;width:100%;height:100%;border-radius:6px;pointer-events:none;z-index:0}
.napZones{position:absolute;inset:0;display:flex;z-index:4;pointer-events:none}
.napZone{flex:1}
.napZone.mid{border-left:1px solid rgba(236,229,210,0.18);border-right:1px solid rgba(236,229,210,0.18)}
#napkin .napLabel{font-size:0.46rem;opacity:1;color:rgba(160,150,135,0.4);letter-spacing:0.15em;z-index:5;
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);white-space:nowrap}
#paletteWrap{display:flex;gap:7px;position:relative}
.palPage{display:none;gap:7px}
.palPage.active{display:flex}
#palToggle{width:22px;height:26px;border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(87,242,161,0.2);
  color:rgba(87,242,161,0.45);font-size:16px;line-height:1;
  touch-action:none;cursor:pointer;transition:transform 0.2s}
#palToggle.flipped{transform:scaleX(-1)}

/* ===== ENHANCEMENT LAYER — PRESENTATION ONLY ===== */
:root{
  --sumi-ink:#10171a;
  --sumi-ink-soft:#1b2527;
  --sumi-paper:#ecead2;
  --sumi-green:#91b9a1;
  --sumi-green-dim:rgba(145,185,161,.42);
  --sumi-line:rgba(236,234,210,.11);
  --sumi-glass:rgba(10,16,18,.78);
  --sumi-shadow:0 18px 50px rgba(0,0,0,.42);
}
html,body{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(117,150,134,.055),transparent 42%),
    linear-gradient(180deg,#0b1012,#11191b 68%,#0a0f11);
}
body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
#canvas{position:fixed;inset:0;touch-action:none;object-fit:contain;object-position:50% 50%}
#fxCanvas{position:fixed;inset:0;z-index:7;pointer-events:none}
#build{letter-spacing:.16em !important;text-shadow:0 1px 16px rgba(0,0,0,.7);opacity:.82}
#bstate{filter:drop-shadow(0 4px 12px rgba(0,0,0,.25))}
#liveStatus{
  position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:12;
  display:flex;align-items:center;gap:7px;padding:7px 9px;
  border:1px solid var(--sumi-line);border-radius:10px;
  background:rgba(9,14,16,.56);
  backdrop-filter:blur(12px) saturate(.82);-webkit-backdrop-filter:blur(12px) saturate(.82);
  box-shadow:0 8px 26px rgba(0,0,0,.22);
  font:600 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.11em;color:rgba(236,234,210,.55);pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
}
#liveStatus span:first-child{color:var(--sumi-green)}
#liveStatus.pressed{transform:translateY(1px)}
#tray{
  box-shadow:var(--sumi-shadow),0 -1px 0 rgba(236,234,210,.055) inset;
  background:linear-gradient(180deg,rgba(23,31,33,.93),rgba(9,14,16,.96));
  border-top:1px solid rgba(236,234,210,.12);
}
#trayTab{box-shadow:0 28px 24px rgba(0,0,0,.35);border-color:rgba(236,234,210,.13) !important}
#trayTab:active{transform:translateY(1px) scale(.985)}
button,.btn,[role="button"]{-webkit-tap-highlight-color:transparent}
#grab{opacity:.65;transition:opacity .2s ease,transform .2s ease}
#tray.open #grab{opacity:.9}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}
}

/* ===== READABILITY PASS ===== */
#build{
  top:calc(6px + env(safe-area-inset-top));font-size:9px;
  letter-spacing:.14em !important;color:rgba(145,185,161,.30);opacity:1;
}
#bstate{top:calc(8px + env(safe-area-inset-top))}
.bbar-label{font-size:8px;color:rgba(236,234,210,.28)}
.bbar{background:rgba(255,255,255,.07)}
#barW .fill{background:rgba(120,180,220,.60)}
#barP .fill{background:rgba(200,180,160,.60)}
/* Diagnostics readout — hidden. Add ?debug to the URL if you want it back. */
#liveStatus{
  display:none;top:calc(26px + env(safe-area-inset-top));right:auto;left:8px;
  padding:6px 10px;font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.08em;color:rgba(236,234,210,.88);background:rgba(9,14,16,.62);
}
#liveStatus.on{display:flex}
#liveStatus span:first-child{color:#9fd3b4}
.dip,#napkin{font-size:.62rem;letter-spacing:.10em}
#dipInk{color:rgba(236,229,210,.85)}
#dipWater{color:rgba(190,220,250,.9)}
#napkin .napLabel{font-size:.56rem;color:rgba(120,112,100,.75)}
.bstyle{font-size:15px;color:rgba(236,229,210,.65)}
.bstyle.active{color:#fff}
#trayTab{font-size:11px;color:rgba(145,185,161,.85)}
#jsonBtn,#snapBtn,#resetBtn{color:rgba(236,229,210,.9)}

/* ===== SUMI-E AESTHETIC PASS (v7.4) — presentation only ===================
   Everything below overrides the dark/terminal styling above. The tray and
   the opening screen now sit on the same cream paper as the canvas, ink is
   the only "UI colour", and a single vermilion — the seal-stamp red — marks
   what's active. No green anywhere. */
:root{
  --washi:#ecead2;              /* the canvas paper (PAP_R/G/B) */
  --washi-deep:#e4e0c6;
  --sumi:#1f1c18;               /* ink */
  --sumi-2:rgba(31,28,24,.72);
  --sumi-3:rgba(31,28,24,.45);
  --sumi-line:rgba(31,28,24,.16);
  --shu:#b8402c;                /* vermilion seal red */
  --shu-soft:rgba(184,64,44,.14);
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Iowan Old Style",Georgia,serif;
  /* Faint fibre texture so the tray reads as the same sheet, not a flat panel. */
  --fibre:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .32  0 0 0 0 .25  0 0 0 .07 0'/></filter><rect width='160' height='160' filter='url(%23f)'/></svg>");
}
html,body{background:var(--washi)}

/* ── top-left build tag and brush meters ── */
#build{color:rgba(31,28,24,.22)!important;text-shadow:none;font-family:var(--serif);letter-spacing:.22em!important}
.bbar{background:rgba(31,28,24,.08)}
.bbar-label{color:rgba(31,28,24,.4)}
#bstate{filter:none}

/* ── opening screen: a sheet of paper with a seal ── */
#permGate{background:var(--washi);background-image:var(--fibre);gap:18px}
#permGate .g{font-family:var(--serif);color:var(--sumi);font-size:26px;letter-spacing:.32em;
  display:flex;flex-direction:column;align-items:center;gap:14px}
#permGate .g .kan{font-size:64px;letter-spacing:0;line-height:1;opacity:.9}
#permGate .g .seal{display:inline-block;width:30px;height:30px;line-height:30px;font-size:14px;
  letter-spacing:0;color:var(--washi);background:var(--shu);border-radius:3px;
  transform:rotate(-4deg);margin-top:-6px;opacity:.9}
#permGate p{font-family:var(--serif);color:var(--sumi-2);font-size:15px;line-height:1.75;max-width:290px}
#permGate button{font-family:var(--serif);font-size:15px;letter-spacing:.14em;text-transform:none;
  background:var(--sumi);color:var(--washi);border:none;border-radius:2px;padding:14px 34px;
  box-shadow:0 1px 0 rgba(0,0,0,.08)}
#permGate button:active{transform:translateY(1px)}
#permGate button.skip{background:transparent;color:var(--sumi-2);
  border:none;border-bottom:1px solid var(--sumi-line);border-radius:0;padding:8px 6px;font-size:14px}
#permStatus{font-family:var(--serif);color:var(--shu);font-size:13px}

/* ── tray: fades up out of the paper ── */
#tray{
  background:
    var(--fibre),
    linear-gradient(180deg,rgba(236,234,210,0) 0,rgba(236,234,210,.88) 16px,rgba(236,234,210,.97) 34px,var(--washi) 100%);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  border-top:none;box-shadow:none;
  padding:14px 12px calc(14px + env(safe-area-inset-bottom));gap:10px;
}
#grab{background:var(--sumi-line);opacity:1}
#trayTab{
  /* A soft pool of paper behind the word, not a box — it has to read over
     painted ink when the tray is closed. */
  background:radial-gradient(ellipse 60% 75% at 50% 70%,rgba(236,234,210,.95) 35%,rgba(236,234,210,0) 100%);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  border:none!important;box-shadow:none;
  color:var(--sumi-2);font-family:var(--serif);font-size:13px;letter-spacing:.3em;
  padding:6px 22px 4px;top:-28px;
}

/* ── swatches: condensed so the row fits a 375–414pt phone ── */
#swatchRow{gap:4px;justify-content:space-between;overflow-x:auto;padding:4px 5px 3px}
#paletteWrap,.palPage{gap:4px}
/* Scales with the screen so the whole row always fits without scrolling. */
.swatch{width:clamp(20px,5.6vw,24px);height:clamp(20px,5.6vw,24px);border:1.5px solid rgba(31,28,24,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.swatch.active{border-color:var(--sumi);transform:scale(1.14);box-shadow:0 0 0 2px var(--washi),0 0 0 3.5px var(--shu)}
#palToggle{border:1px solid var(--sumi-line);color:var(--sumi-2);width:20px;height:24px}
.rowDiv{background:var(--sumi-line);margin:3px 3px}
#resetBtn,#jsonBtn,#snapBtn{width:26px;height:26px;background:transparent;border:1.5px solid var(--sumi-line);color:var(--sumi);font-size:14px}
/* snapshot overlay: long-press the image to save (iOS), tap anywhere to close */
#snapWrap{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(20,18,15,.84);touch-action:auto}
#snapWrap.open{display:flex}
#snapImg{display:block;max-width:94vw;max-height:80vh;border:1px solid rgba(236,229,210,.25);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;touch-action:auto}
#snapHint{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(236,229,210,.6)}
#resetBtn{border-color:rgba(184,64,44,.45);color:var(--shu)}
#resetBtn:active{background:var(--shu-soft)}
#jsonBtn:active,#snapBtn:active{background:rgba(31,28,24,.06)}

/* ── brush row: tiles shrink together instead of spilling off the edge ── */
#brushRow{gap:4px;justify-content:space-between;padding:0}
.bstyle,#disperseToggle,#charToggle,#tiltToggle,.size{
  flex:0 1 30px;min-width:24px;width:auto;height:30px;
  border:1.5px solid var(--sumi-line);background:transparent;
  color:var(--sumi-2);font-family:var(--serif);font-size:16px;border-radius:3px}
.bstyle[data-style="smudge"]{font-size:14px!important}
.bstyle.active{background:var(--sumi);color:var(--washi);border-color:var(--sumi);transform:none}
#disperseToggle{color:var(--sumi);border-color:rgba(31,28,24,.35)}
#disperseToggle.off{color:var(--shu);border-color:rgba(184,64,44,.5);background:var(--shu-soft)}
#charToggle.on{background:var(--sumi);color:var(--washi);border-color:var(--sumi);transform:none}
#tiltToggle.on{background:var(--shu);color:var(--washi);border-color:var(--shu);transform:none}
#tiltToggle.waiting{border-color:rgba(184,64,44,.45);color:var(--shu);background:var(--shu-soft)}
.size{border-radius:50%;flex-basis:30px}
.size i{background:rgba(31,28,24,.45)}
.size.active{border-color:var(--sumi);transform:none}
.size.active i{background:var(--sumi)}

/* ── character sliders: ink thumb, vermilion live fill ── */
#charRow{gap:16px}
.chr label{color:var(--sumi);font-family:var(--serif);font-size:11px;letter-spacing:.1em;font-weight:600}
.chr label b{color:var(--sumi);font-size:12px}
.chr label .lv{color:var(--shu);font-size:12px}
.chr label .lv::after{color:var(--sumi-3)}
.chrDiv{background:var(--sumi-line)}
.chr input[type=range]::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,var(--shu) 0,var(--shu) var(--live,0%),rgba(31,28,24,.14) var(--live,0%))}
.chr input[type=range]::-moz-range-track{
  background:linear-gradient(90deg,var(--shu) 0,var(--shu) var(--live,0%),rgba(31,28,24,.14) var(--live,0%))}
.chr input[type=range]::-webkit-slider-thumb{background:var(--sumi);border:2px solid var(--washi);box-shadow:0 1px 3px rgba(31,28,24,.35)}
.chr input[type=range]::-moz-range-thumb{background:var(--sumi);border:2px solid var(--washi)}

/* ── ink stone, napkin, water: objects on the desk ── */
#dipRow{height:58px;gap:7px}
.dip,#napkin{border-radius:3px;font-family:var(--serif);font-size:.72rem;letter-spacing:.2em}
#dipInk{background:#302d29;color:rgba(236,234,210,.92);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
#dipInk .fill{background:rgba(236,234,210,.14)}
#dipWater{background:#69777c;color:#f1efdf;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
#dipWater .fill{background:rgba(241,239,223,.22)}
#napkin{background:transparent;color:var(--sumi-2);box-shadow:inset 0 0 0 1px var(--sumi-line)}
#napkin .napLabel{color:rgba(31,28,24,.55);font-family:var(--serif);font-size:.64rem}
.napZone.mid{border-color:rgba(31,28,24,.1)}

/* ── v7-ink: brush gauges as columns of calligraphy ──────────────────────────
   Each column is the same characters twice: a faint ghost that marks the empty
   column, and a solid copy masked from the bottom up to the brush's level. As
   the brush runs out the characters fade away from the top down. --e is the
   mask edge in %, set from JS (level * 1.14 so 0 shows nothing, 100 shows all).
   Water is blue, ink is black; no labels. */
#bstate{gap:7px;align-items:flex-start}
.kcol{position:relative;display:flex;flex-direction:column;align-items:center;
  font-family:var(--serif);font-size:15px;line-height:1.1;font-weight:600;--e:0}
.kcol .kg span,.kcol .kl span{display:block;text-align:center}
.kcol .kg{opacity:.10}
.kcol .kl{position:absolute;left:0;right:0;top:0;bottom:0;
  -webkit-mask-image:linear-gradient(to top,#000 calc(var(--e)*1% - 14%),transparent calc(var(--e)*1%));
          mask-image:linear-gradient(to top,#000 calc(var(--e)*1% - 14%),transparent calc(var(--e)*1%))}
#kInk{color:var(--sumi)}
#kWater{color:#3f6a8f}

/* ── v7.5: tray tabs — full tray, napkin only, or closed ── */
#tabRow{position:absolute;top:-28px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:11;white-space:nowrap}
/* tiny brush on the napkin: its shape (point / splay / flat / scrub) and load */
#napBrush{position:absolute;left:auto;right:5px;top:50%;bottom:auto;width:14px;height:40px;margin-top:-20px;z-index:5;pointer-events:none}
/* a live value the napkin is currently moving reads water-blue */
.chr label .lv.nap{color:#3f6a8f}

/* ===== SUMI-E MATERIAL + STUDY LAYER ===== */
#tabRow #paperTab,#tabRow #studyTab{
  position:relative;top:auto;left:auto;transform:none;display:flex;align-items:center;justify-content:center;
  padding:6px 10px 4px;border:0;background:radial-gradient(ellipse 65% 80% at 50% 70%,rgba(236,234,210,.95) 35%,rgba(236,234,210,0) 100%);
  color:var(--sumi-2);font-family:var(--serif);font-size:11px;letter-spacing:.13em;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap
}
#tabRow #paperTab{color:var(--shu);letter-spacing:.08em}
#tabRow #studyTab{color:var(--sumi-2)}
#tabRow #paperTab:active,#tabRow #studyTab:active{transform:translateY(1px)}
#flickToggle{flex:0 1 38px;min-width:34px;width:auto;height:30px;border:1.5px solid rgba(184,64,44,.32);
  background:transparent;color:rgba(184,64,44,.62);border-radius:3px;font:600 9px/1 var(--serif);letter-spacing:.03em;
  display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
#flickToggle.on{background:var(--shu);border-color:var(--shu);color:var(--washi)}
#studyPanel{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
  background:rgba(24,22,18,.48);touch-action:pan-y}
#studyPanel.open{display:flex}
.study-card{width:min(94vw,430px);max-height:78dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 19px 16px;background:var(--washi);color:var(--sumi);border:1px solid rgba(31,28,24,.22);
  box-shadow:0 16px 50px rgba(20,18,15,.25);font-family:var(--serif);touch-action:pan-y}
.study-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--sumi-line);padding-bottom:9px}
#studyKicker{font-size:10px;letter-spacing:.18em;color:var(--shu)}
#studyClose{width:30px;height:30px;border:0;background:transparent;color:var(--sumi);font:28px/1 var(--serif);cursor:pointer}
#studyTitle{font:500 24px/1.2 var(--serif);margin:15px 0 11px;letter-spacing:.015em}
#studyBody{font:15px/1.7 var(--serif);color:var(--sumi-2);white-space:pre-line}
#studyPrompt{margin-top:14px;padding:12px 13px;border-left:2px solid var(--shu);background:rgba(31,28,24,.045);
  font:14px/1.65 var(--serif);color:var(--sumi)}
.study-nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.study-nav button{min-height:36px;padding:7px 14px;border:1px solid var(--sumi-line);background:transparent;color:var(--sumi);
  font:11px/1 var(--serif);letter-spacing:.12em;cursor:pointer}
.study-nav button:disabled{opacity:.3}
.study-nav button:last-child{background:var(--sumi);color:var(--washi);border-color:var(--sumi)}
.study-source{margin-top:13px;font:11px/1.5 var(--serif);color:var(--sumi-3)}



/* ===== SUMI v9.2.4 · consolidated mobile/material tray ====================
   One material station, one set of dimensions. No alternate napkin-only modes.
   The original painting engine, brush input and study tools are unchanged. */
#tray{
  width:100%;max-width:100%;max-height:100dvh;overflow:visible;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));gap:0;
  background:linear-gradient(180deg,rgba(236,234,210,.985),var(--washi));
  box-shadow:0 -4px 14px rgba(31,28,24,.07);
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
}
#tray.visible{transform:translateY(0)}
#tabRow{
  position:absolute;top:-36px;left:0;right:0;width:auto;height:36px;
  display:block;transform:none;pointer-events:none;z-index:12;
}
#tabRow #trayTab{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;
  width:76px;min-width:76px;height:36px;min-height:36px;padding:0;
  border:1px solid rgba(49,45,38,.18);border-bottom:0;
  border-radius:13px 13px 0 0;background:rgba(236,234,210,.98);
  box-shadow:0 -3px 10px rgba(31,28,24,.07);
  color:rgba(49,45,38,.78);font:20px/1 sans-serif;letter-spacing:0;
  pointer-events:auto;touch-action:manipulation;cursor:pointer;
}
#tabRow #trayTab.on{background:transparent;border:0;color:var(--sumi)}
#tabRow #resetQuick{
  position:absolute;right:5px;top:-8px;display:flex;align-items:center;justify-content:center;
  width:22px;height:22px;min-width:22px;min-height:22px;padding:0;
  border:1px solid rgba(184,64,44,.25);border-radius:50%;
  background:rgba(236,234,210,.94);color:var(--shu);font:16px/1 var(--serif);
  pointer-events:auto;touch-action:manipulation;
}
#tray.visible #resetQuick{display:none}
#grab{display:none}
#trayScroll{
  display:flex;flex:0 1 auto;flex-direction:column;align-items:stretch;justify-content:flex-end;
  width:100%;min-width:0;max-height:40dvh;gap:5px;
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;
}
#trayScroll::-webkit-scrollbar{display:none}

/* Brush and palette controls */
#brushOptions,#settingsPanel{
  display:none;flex:0 0 auto;width:100%;min-width:0;
  padding:0;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none;
}
#tray #brushOptions{display:flex;flex-direction:column;gap:4px}
#tray #brushOptions .panelHead{display:none!important}
#brushOptions.open,#settingsPanel.open{display:flex;flex-direction:column;gap:5px}
#brushRow{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:4px;width:100%;min-width:0;padding:0}
#brushModes{display:flex;flex:1 1 auto;min-width:0;align-items:center;justify-content:space-between;gap:3px}
/* Keep the entire brush-style / utility row out of the everyday tray.
   The row is removed from layout, not merely emptied; a long-press on the
   brush handle reveals it with the advanced brush controls. */
#brushRow{display:none!important}
#brushOptions.open #brushRow{display:flex!important}
#brushModes{display:none!important}
#brushOptions.open #brushModes{display:flex!important;flex:1 1 auto;min-width:0}
#brushRow .bstyle{
  display:flex;flex:1 1 0;align-items:center;justify-content:center;
  width:auto;min-width:0;height:27px;min-height:27px;padding:0 1px;
  border:1px solid rgba(49,45,38,.15);border-radius:3px;
  background:transparent;color:rgba(31,28,24,.56);
  font:14px/1 var(--serif);white-space:nowrap;box-shadow:none;
}
#brushRow .bstyle.active{background:var(--sumi);border-color:var(--sumi);color:var(--washi)}
#brushTools{display:flex;flex:0 0 auto;align-items:center;justify-content:flex-end;gap:3px;width:auto;min-width:0;padding:0}
#brushTools #disperseToggle,#brushTools #charToggle,#brushTools #flickToggle,
#brushTools #settingsBtn,#brushTools #resetBtn{
  display:flex;flex:0 0 24px;align-items:center;justify-content:center;
  width:24px;min-width:24px;height:26px;min-height:26px;padding:0;
  border:1px solid var(--sumi-line);border-radius:3px;background:transparent;
  color:var(--sumi-2);font:13px/1 var(--serif);touch-action:manipulation;cursor:pointer;
}
#brushTools #settingsBtn{font-size:12px}
#brushTools #resetBtn{color:var(--shu);border-color:rgba(184,64,44,.35);font-size:17px}
#brushTools #settingsBtn.on,#brushTools #disperseToggle.on,#brushTools #charToggle.on{
  background:var(--sumi);border-color:var(--sumi);color:var(--washi)
}
#brushTools #disperseToggle.off{background:transparent;border-color:var(--sumi-line);color:var(--shu)}
#brushTools #flickToggle{color:var(--sumi-3);border-color:rgba(49,45,38,.15)}
#brushTools #flickToggle.on{background:var(--shu);border-color:var(--shu);color:var(--washi)}
#swatchRow{
  display:flex;flex:0 0 auto;align-items:center;justify-content:space-between;
  gap:5px;width:100%;min-width:0;min-height:25px;padding:0;overflow:hidden;
}
#sizeRow{display:flex;flex:0 0 auto;align-items:center;justify-content:flex-start;gap:3px;padding-left:1px}
#sizeRow .size{
  display:flex;flex:0 0 25px;align-items:center;justify-content:center;
  width:25px;min-width:25px;height:25px;min-height:25px;
  border:1px solid rgba(31,28,24,.2);border-radius:50%;background:transparent;
  touch-action:manipulation;
}
#sizeRow .size.active{border:2px solid var(--sumi);background:rgba(31,28,24,.05)}
#sizeRow .size i{display:block;max-width:13px;max-height:13px;border-radius:50%;background:rgba(31,28,24,.5)}
#sizeRow .size.active i{background:var(--sumi)}
#paletteWrap{display:flex;flex:1 1 auto;min-width:0;overflow:hidden;gap:3px}
#paletteWrap .palPage.active{display:flex;flex:1 1 auto;min-width:0;align-items:center;justify-content:space-between;gap:clamp(2px,.55vw,4px)}
#paletteWrap .palPage:not(.active){display:none}
#swatchRow .swatch{
  display:block;flex:0 0 clamp(14px,4.6vw,18px);width:clamp(14px,4.6vw,18px);
  height:clamp(14px,4.6vw,18px);min-width:0;min-height:0;border-radius:50%;
  border:1px solid rgba(31,28,24,.2);opacity:.86;
}
#swatchRow .swatch.active{opacity:1;transform:scale(1.08);box-shadow:0 0 0 1px var(--washi),0 0 0 2px var(--shu)}
#palToggle{display:flex;flex:0 0 21px;align-items:center;justify-content:center;width:21px;min-width:21px;height:23px;min-height:23px;padding:0;border:1px solid rgba(31,28,24,.18);border-radius:3px;color:var(--sumi-2);font-size:15px}
#palToggle.flipped{background:var(--sumi);border-color:var(--sumi);color:var(--washi)}
#charRow{display:none;flex:0 0 auto;width:100%;min-width:0;max-width:100%;gap:8px;padding:3px 0;max-height:58px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#charRow.open{display:flex}
#charRow::-webkit-scrollbar{display:none}
#charRow .chr{flex:0 0 92px;min-width:92px}
#charRow .chr label{color:var(--sumi);font-family:var(--serif);font-size:10px;letter-spacing:.08em}
#charRow .chr label b{color:var(--sumi);font-size:11px}
#charRow .chr label .lv{color:var(--shu);font-size:11px}
#charRow .chr input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--shu) 0,var(--shu) var(--live,0%),rgba(31,28,24,.14) var(--live,0%))}
#charRow .chr input[type=range]::-moz-range-track{background:linear-gradient(90deg,var(--shu) 0,var(--shu) var(--live,0%),rgba(31,28,24,.14) var(--live,0%))}
#charRow .chr input[type=range]::-webkit-slider-thumb{background:var(--sumi);border:2px solid var(--washi)}
#charRow .chr input[type=range]::-moz-range-thumb{background:var(--sumi);border:2px solid var(--washi)}

/* The material wells and napkin have one permanent geometry in every view. */
#dipRow{
  display:flex;flex:0 0 62px;align-items:stretch;gap:5px;
  width:100%;min-width:0;height:62px;min-height:62px;margin-top:1px;
}
#dipInk,#dipWater{
  display:flex;position:relative;flex:1 1 0;align-items:center;justify-content:center;
  width:auto;min-width:0;height:62px;min-height:62px;overflow:hidden;border-radius:3px;
  font:20px/1 var(--serif);letter-spacing:0;touch-action:none;-webkit-tap-highlight-color:transparent;
  box-shadow:inset 0 0 0 1px rgba(31,28,24,.08);
}
#dipInk{background:#302d29;color:rgba(236,234,210,.90)}
#dipWater{background:#71838a;color:rgba(245,244,230,.96)}
#dipInk.pressed,#dipWater.pressed{filter:brightness(1.12);box-shadow:inset 0 0 0 2px rgba(236,234,210,.32)}
#dipInk .fill,#dipWater .fill{opacity:.65;pointer-events:none}
#dipInk span,#dipWater span{position:relative;z-index:2;font-size:19px;pointer-events:none}
#napkin{
  position:relative;display:flex;flex:1.4 1 0;align-items:center;justify-content:center;
  width:auto;min-width:0;height:62px;min-height:62px;overflow:hidden;border-radius:3px;
  background:rgba(236,234,210,.36);box-shadow:inset 0 0 0 1px rgba(31,28,24,.13);
  touch-action:none;cursor:crosshair;
}
#napCanvas{position:absolute;inset:0;width:100%;height:100%;border-radius:3px;pointer-events:none;opacity:.9}
.napZones{position:absolute;inset:0;display:flex;z-index:4;pointer-events:none}
.napZone{position:relative;flex:1;min-width:0}
.napZone.mid{border-left:1px solid rgba(31,28,24,.095);border-right:1px solid rgba(31,28,24,.095)}
#napkin .napLabel{position:absolute;left:50%;top:5px;transform:translateX(-50%);z-index:5;color:rgba(31,28,24,.48);font:9px/1 var(--serif);letter-spacing:.15em;pointer-events:none}
.napZone::after{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font:9px/1 var(--serif);color:rgba(31,28,24,.30);pointer-events:none}
.napZone:first-child::after{content:'墨'}
.napZone.mid::after{content:'調'}
.napZone:last-child::after{content:'水'}
#brushHandle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);z-index:8;
  display:flex;align-items:center;justify-content:center;width:34px;height:48px;margin:0;
  border-radius:20px;background:rgba(236,234,210,.42);border:1px solid rgba(31,28,24,.12);
  box-shadow:0 2px 9px rgba(31,28,24,.06);touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#brushHandle:active,#brushHandle.pressed{background:rgba(31,28,24,.08);border-color:rgba(31,28,24,.38)}
#napBrush{position:relative;display:block;width:16px;height:40px;margin:0;z-index:1;pointer-events:none}
#brushFlash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;color:rgba(31,28,24,.82);font:30px/1 var(--serif);pointer-events:none;opacity:0;text-shadow:0 1px 8px rgba(236,234,210,.8)}
#brushFlash.show{animation:brushFlashLife 1s ease both}
@keyframes brushFlashLife{0%{opacity:0;filter:blur(2px);transform:translate(-50%,-46%) scale(.94)}18%{opacity:.92;filter:blur(0);transform:translate(-50%,-50%) scale(1)}76%{opacity:.92}100%{opacity:0;filter:blur(1px);transform:translate(-50%,-54%) scale(1.02)}}

/* Settings are a separate panel; they do not resize the material station. */
#settingsPanel.open{display:flex;flex-direction:column;gap:4px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
#settingsPanel .panelHead{display:none!important}
#settingsActions{display:flex;align-items:center;gap:4px}
#settingsActions #paperTab,#settingsActions #studyTab,#settingsActions #snapBtn,#settingsActions #jsonBtn{
  display:flex;flex:1 1 0;align-items:center;justify-content:center;min-width:0;height:26px;min-height:26px;padding:0;
  border:1px solid rgba(31,28,24,.16);border-radius:2px;background:transparent;color:var(--sumi-2);
  font:14px/1 var(--serif);touch-action:manipulation;
}
#settingsActions #paperTab:active,#settingsActions #studyTab:active,#settingsActions #snapBtn:active,#settingsActions #jsonBtn:active{background:rgba(31,28,24,.08)}
#tray.settings-open #brushOptions{display:none!important}
#tray.settings-open #dipRow{display:none!important}
#tray #settingsPanel .panelHead{display:none!important}
#liveStatus{display:none!important}
#build{color:rgba(31,28,24,.22)!important;text-shadow:none;font-family:var(--serif);letter-spacing:.22em!important}
#bstate{filter:none;gap:7px;align-items:flex-start}
.kcol{position:relative;display:flex;flex-direction:column;align-items:center;font-family:var(--serif);font-size:15px;line-height:1.1;font-weight:600;--e:0}
.kcol .kg span,.kcol .kl span{display:block;text-align:center}
.kcol .kg{opacity:.10}
.kcol .kl{position:absolute;left:0;right:0;top:0;bottom:0;-webkit-mask-image:linear-gradient(to top,#000 calc(var(--e)*1% - 14%),transparent calc(var(--e)*1%));mask-image:linear-gradient(to top,#000 calc(var(--e)*1% - 14%),transparent calc(var(--e)*1%))}
#kInk{color:var(--sumi)}#kWater{color:#3f6a8f}


@media(max-width:360px){
  #tray{padding-left:7px;padding-right:7px}
  #trayScroll{gap:4px;max-height:44dvh}
  #brushRow{gap:3px}
  #brushRow .bstyle{height:25px;min-height:25px;font-size:12px}
  #brushTools{gap:2px}
  #brushTools #disperseToggle,#brushTools #charToggle,#brushTools #flickToggle,#brushTools #settingsBtn,#brushTools #resetBtn{flex-basis:22px;width:22px;min-width:22px;height:24px;min-height:24px}
  #sizeRow{gap:2px}
  #sizeRow .size{flex-basis:23px;width:23px;min-width:23px;height:23px;min-height:23px}
  #swatchRow{gap:3px}
  #swatchRow .swatch{flex-basis:13px;width:13px;height:13px}
  #palToggle{flex-basis:19px;width:19px;min-width:19px;height:21px;min-height:21px}
  #dipRow{gap:4px;height:62px;min-height:62px;flex-basis:62px}
  #dipInk,#dipWater,#napkin{height:62px;min-height:62px}
  #brushHandle{right:4px;width:30px;height:45px}
  #napBrush{width:14px;height:36px}
}
@media(max-height:700px){#trayScroll{max-height:38dvh}}

<script type="text/plain" id="sumiEngine">
function SUMI_ENGINE(host){

// request the same integer lattice hashes; caching removes the repeated sin()
// calls without changing a single noise value. Collisions only replace entries.

const noiseCacheY=new Int32Array(NOISE_CACHE_SIZE);

  if(noiseCacheValid[slot]&&noiseCacheX[slot]===ix&&noiseCacheY[slot]===iy)return noiseCacheV[slot];

// no vehicle — nothing for the transport step to move, so every pinhole stayed a
// pinhole. Ink still outweighs water heavily; this is a wetted brush, not a wash.
const BRUSH_RAD=1.0,BRUSH_W_CAP=50000,BRUSH_P_CAP=40000,DEP_W=0.000018,DEP_P=0.00012;
// Paper is part of the instrument: each surface changes tooth, fibre density,
// capillary movement, edge drying and pigment fixation. These are tuned digital
// analogues of the book's material descriptions, not laboratory measurements.
const PAPER_PRESETS={
  gasenshi:{name:'Gasen-shi',frequency:1.00,tooth:1.00,fibre:1.00,fibreLength:1.00,spread:1.00,suction:1.00,fix:1.00,edge:1.00,tone:1.00},
  kozo:{name:'Kōzo / Ma-shi',frequency:0.78,tooth:1.30,fibre:1.42,fibreLength:1.25,spread:1.18,suction:1.28,fix:1.22,edge:1.10,tone:1.08},
  torinoko:{name:'Torinoko',frequency:1.15,tooth:0.38,fibre:0.24,fibreLength:0.72,spread:0.68,suction:0.62,fix:0.72,edge:0.62,tone:0.55}
};
let PAPER_ID='gasenshi',paperPhysics=PAPER_PRESETS[PAPER_ID];
// v7.5b: how the live brush spends its load.

// this share of its ink, then fades out. INK_KNEE_N is the softness of that knee
// (higher = sharper). INK_DRAIN / WATER_DRAIN: share of what a stroke lays down
// that actually leaves the brush, so one load paints about twice as far.
// Touch drawing only — JSON layers keep the old linear load and full drain, so
// loaded pieces look exactly as before.
const INK_KNEE=0.10,INK_KNEE_N=4,INK_DRAIN=0.2,WATER_DRAIN=0.5;

// ═══ v7.2 SUBTRACTIVE COLOUR ═══════════════════════════════════════════════
// Cell colour (mR/mG/mB, fR/fG/fB) is stored as ABSORBANCE per unit pigment,
// not as an RGB colour. Every place that averages colours by pigment weight
// (transport, rewet, smudge, splatter, fixing) therefore averages absorbance,
// which is subtractive mixing: blue + yellow absorbs red AND blue and leaves
// green-teal, instead of the RGB average's milky grey. Rendering is
// Beer–Lambert: the paper's light is filtered through the ink, so layers glaze
// (multiply) instead of covering. Computed in linear light.
// Absorbance is measured relative to the paper, so one ordinary layer of a
// swatch on paper reproduces that swatch — the palette keeps its tuning.
// LAYER_COVER is no longer used (it was the opaque "newest colour wins" rule).
const ABS_FLOOR=0.002,ABS_MAX=7.0;
// Density curve: D = DEN_MAX·(1−exp(−P·DEN_K/DEN_MAX)). DEN_K matches the old
// renderer's darkness for thin washes; DEN_MAX lets stacked glazes keep
// deepening without every overlap going straight to black.

// hue unchanged. Carbon black is ~5x more absorbing than the colours; without
// this, one density curve can't give both sumi greys and full-strength colour.
const ABS_CAP=3.0;

  const a=[Math.max(0,-Math.log(Math.max(ABS_FLOOR,s2l(r))/PAP_LIN[0])),

           Math.max(0,-Math.log(Math.max(ABS_FLOOR,s2l(b))/PAP_LIN[2]))];

// to actually mix with its neighbours before locking — that is where blending lives.
// It still DRIES: this is ink on paper, not a wash that never sets.
const SPREAD_RATE=2.6,EDGE_EVAP_MULT=0.9,HINDRANCE=0.68;

// K_PIG 0.90 — endless wet window, water pooling before it bursts into dry
// paper, fixed pigment damming the flow into blotchy blooms. v4 was the
// opposite: dries fast, edges lock hard. v6 keeps both and picks per cell.
// v6: these are no longer live values, they are the two ENDS of a range. Each
// cell remembers how wet the brush was that fed it (wetF) and interpolates
// between them per cell. That matters: if the wet/bloom behaviour were global
// and slaved to the current brush, picking up a dry brush would retroactively
// lock a wash you laid down five strokes ago. Per-cell means a wet stroke can
// bloom next to a dry stroke that locks hard, on the same paper.

const FIX_DRY =.8,FIX_WET =0.0011;    // v4 -> v3
const SIG_DRY =0.08, SIG_WET =0.95;      // v4 -> v3
const KPIG_DRY=0.28, KPIG_WET=0.90;      // v4 -> v3

let WET_GAIN=0.82,BLOOM_GAIN=0.78;

// the weight/request that addDeposit already computes. All three character

//   P point  clean pull-downs drew the hairs to a tip: calmer, more solid stroke
//   S splay  smushing / pushing spread the hairs: chatter, grain, split hairs
//   F flat   a sideways drag pressed it into a chisel: more heel, less chatter/grain

// the shared edge (water moves one cell per step, so that is the only place it
// can cross). v7.5: this replaces the old 3×3 halo around every wet tile, which
// made a thin stroke simulate ~3 tile rows of dry paper.

// Tile renderer — only flagged tiles recomposite; one upload per horizontal run.

// ═══ SPLATTER (v7: SPLAT v3.2 physics, depositing into the ink sim) ═══
// Ported from splat_v3: Rayleigh–Taylor droplet size, Weber-number breakup
// regimes, bimodal fat/mist distribution, size-dependent carry, Comiskey/Yarin
// impact spread, teardrop stain outline, crown satellites, forward spines and
// ligament bead rows. What's different from SPLAT: nothing is painted onto the
// canvas. Every stain lands in the mobile pigment + water layers, so splatter
// bleeds, blooms, rims and dries exactly like a brush stroke does.
// Gyro-only parts of SPLAT (loft/slam, spin, tilt drips) are not ported — SUMI
// is touch-driven and the paper is flat.
//
// Brush state drives the ink's material: a wet brush throws thin, low-viscosity
// ink (fine mist, wide cone); a dry, pigment-heavy brush throws thick ink (fewer,
// fatter drops). Pigment load sets how dark the drops are (it replaces SPLAT's

// finger speed and speed-up feed droplet size.

// water range from a dry to a fully wet brush.

// contact-driven radius, not just the size button) scales every drop and its
// stain. It is applied AFTER the breakup physics, so a big brush throws big
// drops without also atomising harder — the Weber regime still comes from
// flick speed and ink thickness. Darkness still comes from ink load and
// wetness from water load, so any size can be dark or wet.

const SPL_R_REF=20,SPL_R_EXP=0.9,SPL_DROPK_MIN=0.12,SPL_DROPK_MAX=3.8;

// Drops and satellites that land past the edge are simply off the paper:
// depositStain clips per cell, so a stain half over the edge is half there.
// One stain in the sim. Same outline as SPLAT's paintDrop: ellipse along the
// travel direction, narrower at the leading end (taper), slight wobble. The
// pigment/water budget is fixed by the caller and normalised over the footprint,
// so ink is conserved no matter how big the stain turns out.

// px,py: grid coords. angle: radians. speed: legacy flick units (px/ms × 30),

let strokePts=[];
function maybeFlick(){if(strokePts.length<3)return;const n=strokePts.length;const last=strokePts[n-1];const prev=strokePts[Math.max(0,n-8)];const dx=last.x-prev.x,dy=last.y-prev.y;const dt=(last.t-prev.t)||1;const spd=Math.hypot(dx,dy)/dt*15;const ang=Math.atan2(dy,dx);

    // the ink into finer drops than a steady fast drag.

// v7.5: the page parses the JSON (so it can alert on errors) and sends the palettes.
function importJsonLayer(data,palettes){

  if(Array.isArray(data)){for(const d of data){const gx=Math.round(d.x),gy=Math.round(d.y);if(gx<0||gy<0||gx>=NX||gy>=NY)continue;const idx=gy*NX+gx;const sat=Math.min(1,Math.max(0,d.sat||0));const pig=Math.min(sat*PIGMENT_CAP,Math.max(0,d.pig||0));const toPixel=v=>(v==null?0:v<=1.0?v*255:v);const ir=toPixel(d.r),ig=toPixel(d.g),ib=toPixel(d.b);const A=absOf(ir/255,ig/255,ib/255);const existing=fPig[idx];const total=existing+pig;if(total>1e-6){const ew=existing/total,nw=pig/total;fR[idx]=fR[idx]*ew+A[0]*nw;fG[idx]=fG[idx]*ew+A[1]*nw;fB[idx]=fB[idx]*ew+A[2]*nw;fPig[idx]=Math.min(PIGMENT_CAP,total)}else{fPig[idx]=Math.min(PIGMENT_CAP,pig);fR[idx]=A[0];fG[idx]=A[1];fB[idx]=A[2]}}requestFullRepaint();statePending=true;host.post({t:'jsonDone',pixels:data.length});return}

  const _live=liveBrush;liveBrush=false;
  // napkin shape belongs to the hand, not to loaded pieces
  const _nap={P:NAP.P,S:NAP.S,F:NAP.F,Z:NAP.Z};NAP.P=NAP.S=NAP.F=NAP.Z=0;
  const _brushW=brush.w,_brushP=brush.p,_inkR=inkR,_inkG=inkG,_inkB=inkB,_brushRadius=brushRadius,_brushStyle=brushStyle,_strokeSeed=strokeSeed;

  let strokeCount=0,dabCount=0;for(let si=0;si<(data.strokes||[]).length;si++){const stroke=data.strokes[si];if(!stroke.path||stroke.path.length<1)continue;

    const rgb=resolveColor(stroke.color);
    if(rgb){inkR=rgb[0];inkG=rgb[1];inkB=rgb[2]}

    const gain=Math.max(0.1,Math.min(20,stroke.gain??1.0));
    brush.w=Math.min(BRUSH_W_CAP*gain,Math.max(0,(stroke.water??0.8)*BRUSH_W_CAP*gain));
    brush.p=Math.min(BRUSH_P_CAP*gain,Math.max(0,(stroke.pigment??0.5)*BRUSH_P_CAP*gain));

    brushRadius=stroke.brush??brushRadius;
    brushStyle=(stroke.style&&['round','point','side','rake','smudge'].includes(stroke.style))?stroke.style:brushStyle;
    const press=Math.min(1,Math.max(0,stroke.pressure??0.5));
    // v7-ink: press and lift. Optional per-stroke keys, absent = exactly as before.
    //   taper: 0..1 (or [in,out]) = fraction of the stroke length at each end over which pressure
    //          eases up from a light touch / back down to one. 0.25 = a quarter of the stroke each end.
    //   swell: 0..1 = belly. Pressure is full mid-stroke and lighter toward both ends, by this much.
    const _tp=stroke.taper,tpIO=Array.isArray(_tp)?[+_tp[0]||0,+_tp[1]||0]:[+_tp||0,+_tp||0];

    else{addDeposit(pts[0][0],pts[0][1],pressAt(0),0,0);dabCount++;
      for(let p=0;p<pts.length-1;p++){drawSegment(pts[p][0],pts[p][1],pts[p+1][0],pts[p+1][1],pressAt(cumLen[p]),pressAt(cumLen[p+1]));

// ═══ ANIMATION ═══
let partBox=null;
function animate(timestamp){

  while(simAccumulator+0.01>=SIM_STEP_MS){
    const stepTime=now-simAccumulator+SIM_STEP_MS;
    simulateStep();
    tickHold(stepTime);
    const nFly=splatParticles.length;

}

  tip:v=>{TIP_LOAD=v},feather:v=>{FEATHER=v},wabi:v=>{WABI=v},

}

<script>
(()=>{

// ═══ TRAY UI ═══

  const html=[...str].map(c=>'<span>'+c+'</span>').join('');
  el.querySelector('.kg').innerHTML=html;el.querySelector('.kl').innerHTML=html});

  if(wp===_lastWp&&pp===_lastPp)return;_lastWp=wp;_lastPp=pp;

  setKanji(kWaterEl,wp);setKanji(kInkEl,pp)}
// v7: the character sliders show what the brush is doing right now. The thumb
// is still your setting (a ceiling for Chatter/Grain/Heel, a gain for Wet/Bloom);
// the vermilion fill and number are the live amount at the current load.
// v7.5: the live amount includes the napkin shape. When the napkin is moving a

const LIVE=[['sChat','lChat','chat'],['sGrain','lGrain','grain'],['sHeel','lHeel','heel'],['sWet','lWet','wet'],
  ['sBloom','lBloom','bloom'],['sDrop','lDrop','drop'],['sWabi','lWabi','wabi']].map(([s,l,k])=>({el:document.getElementById(s),out:document.getElementById(l),k,pct:-1,txt:''})).filter(o=>o.el&&o.out);

// ═══ NAPKIN — drains the brush and shapes it ═══
// Zones stay as they were: left drains ink, middle both, right water. How you

const napCvs=document.getElementById('napCanvas'),napCtx=napCvs.getContext('2d');const NAP_W=360,NAP_H=120;

  napCtx.beginPath();napCtx.moveTo(x2+0.5,0);napCtx.lineTo(x2+0.5,NAP_H);napCtx.stroke();

// The base texture is retained, so repeated closes fade pigment without bleaching the napkin.
function fadeNapkinInk(amount=0.18){

    for(let i=0;i<a.length;i+=4){a[i]=a[i]+(b[i]-a[i])*k;a[i+1]=a[i+1]+(b[i+1]-a[i+1])*k;a[i+2]=a[i+2]+(b[i+2]-a[i+2])*k;a[i+3]=b[i+3]}

}
// One dab of the brush on the napkin: draws the mark and returns how much of

// ── Brush shape ──────────────────────────────────────────────────────────
// Four charges, 0..1, that the engine applies on top of the sliders:
//   P point — clean pull-downs: chatter, grain, dry skip and streaking calm down
//   S splay — any push into the napkin (smush, pushing up, pressing): chatter, grain, split hairs
//   F flat  — a one-way sideways drag: heel up, chatter and grain down
//   Z scrub — a quick left-right zigzag: chatter, grain, wabi
// Pushing raises the uncertain side, smooth clean strokes calm it. Opposites
// cancel, like re-forming a real tip. v7.5b: only the napkin changes the shape;
// painting leaves it alone (set NG.paintWear above 0 to let strokes wear it off).
const NAP={P:0,S:0,F:0,Z:0};
const NG={
  revMin:5,          // CSS px of travel the other way before a turn counts as a reversal
  window:650,        // ms a reversal stays recent (zigzag / smush need 2 of them)
  axis:1.4,          // how much one axis must dominate the other to count as vertical / sideways
  pointStart:10,     // a pull-down only starts pointing after this much clean travel
  flatStart:25,      // a sideways drag only starts flattening after this much one-way travel
  kPoint:1/150,      // charge per px — about three clean ~60px pull-downs for a full point
  kSplay:1/120,kScrub:1/160,kFlat:1/140,
  pushUp:0.35,       // pushing up against the hairs splays at this fraction of a smush
  bumpSplay:0.04,bumpScrub:0.05,   // extra per reversal
  pressRate:0.12,    // splay per second of a still press at normal finger contact
  tap:0.03,          // a quick tap
  smushBlot:1.8,     // pushing blots harder: drain multiplier while smushing / pressing
  cancel:1.2,        // point and splay/scrub wipe each other out at this rate
  flatBreak:0.5,splayBreaksFlat:0.6,scrubBreaksFlat:0.4,
  paintWear:0,       // 0 = only the napkin shapes the brush. 1 = strokes wear the shape off over
  wearWet:420,wearDry:210   // this many grid px of painting (to ~37%), faster on a dry brush
};
const c01=v=>v<0?0:v>1?1:v;
function addPoint(a){if(!(a>0))return;NAP.P=c01(NAP.P+a);NAP.S=c01(NAP.S-a*NG.cancel);NAP.Z=c01(NAP.Z-a*NG.cancel);napChanged(true)}
function addSplay(a){if(!(a>0))return;NAP.S=c01(NAP.S+a);NAP.P=c01(NAP.P-a*NG.cancel);NAP.F=c01(NAP.F-a*NG.splayBreaksFlat);napChanged(true)}
function addScrub(a){if(!(a>0))return;NAP.Z=c01(NAP.Z+a);NAP.P=c01(NAP.P-a*NG.cancel);NAP.F=c01(NAP.F-a*NG.scrubBreaksFlat);napChanged(true)}
function addFlat(a){if(!(a>0))return;NAP.F=c01(NAP.F+a);NAP.S=c01(NAP.S-a*NG.flatBreak);NAP.Z=c01(NAP.Z-a*NG.flatBreak);napChanged(true)}
function napOut(){return{P:NAP.P,S:NAP.S,F:NAP.F,Z:NAP.Z}}
let _napFrame=0,_napSend=false;
function napChanged(tellEngine){if(tellEngine)_napSend=true;if(_napFrame)return;
  _napFrame=requestAnimationFrame(()=>{_napFrame=0;if(_napSend){_napSend=false;send({t:'nap',v:napOut()})}drawBrushIcon();refreshLive()})}
// Optional: painting wears the shape off (off by default, see NG.paintWear).
function wearNap(d){if(!(NG.paintWear>0)||!(d>0)||!(NAP.P||NAP.S||NAP.F||NAP.Z))return;
  const wf=B.w/(B.w+B.p+1e-12),L=NG.wearWet+(NG.wearDry-NG.wearWet)*(1-wf),k=Math.exp(-d*NG.paintWear/L);

  napChanged(false)}

// Gesture reader: per-axis runs and reversals, in CSS px.
const AX={h:{dir:0,run:0,back:0,lat:0,revs:[]},v:{dir:0,run:0,back:0,lat:0,revs:[]}};
function axReset(){for(const k in AX){const A=AX[k];A.dir=0;A.run=0;A.back=0;A.lat=0;A.revs.length=0}}
// d = travel along this axis, lat = travel across it. Returns true on a reversal.
function axStep(A,d,lat,now){
  const s=d>0.3?1:d<-0.3?-1:0;
  if(!s){A.lat+=lat;return false}
  const m=Math.abs(d);
  if(A.dir===0){A.dir=s;A.run=m;A.back=0;A.lat=lat;return false}
  if(s===A.dir){A.run+=m+A.back;A.back=0;A.lat+=lat;return false}
  A.back+=m;
  if(A.back<NG.revMin)return false;
  A.revs.push(now);if(A.revs.length>8)A.revs.shift();
  A.dir=s;A.run=A.back;A.back=0;A.lat=0;return true}
function recentRevs(A,now){let n=0;for(let i=A.revs.length-1;i>=0;i--){if(now-A.revs[i]<=NG.window)n++;else break}return n}
// Returns the drain multiplier for this move (pushing blots harder).
function readGesture(dx,dy,now){
  const ax=Math.abs(dx),ay=Math.abs(dy);
  const hTurn=axStep(AX.h,dx,ay,now),vTurn=axStep(AX.v,dy,ax,now);
  const hRev=recentRevs(AX.h,now),vRev=recentRevs(AX.v,now);
  if(ax>ay*NG.axis){
    if(hRev>=2)addScrub(ax*NG.kScrub+(hTurn?NG.bumpScrub:0));
    else if(AX.h.run>NG.flatStart)addFlat(ax*NG.kFlat*Math.max(0.3,1-1.5*AX.h.lat/Math.max(1,AX.h.run)));
  }else if(ay>ax*NG.axis){
    if(vRev>=2){addSplay(ay*NG.kSplay+(vTurn?NG.bumpSplay:0));return NG.smushBlot}
    if(dy>0){if(AX.v.run>NG.pointStart)addPoint(ay*NG.kPoint*Math.max(0,1-1.5*AX.v.lat/Math.max(1,AX.v.run)))}
    else addSplay(ay*NG.kSplay*NG.pushUp);

function contactK(e){const c=Math.max(e.width||0,e.height||0);return clamp((c-18)/30,0.4,1.6)}

// Tiny brush on the napkin showing its current shape and load.
const iconCvs=document.getElementById('napBrush'),iconCtx=iconCvs?iconCvs.getContext('2d'):null;
const ICON_W=14,ICON_H=40,ICON_DPR=Math.min(3,window.devicePixelRatio||2);
if(iconCvs){iconCvs.width=ICON_W*ICON_DPR;iconCvs.height=ICON_H*ICON_DPR}
let _iconKey='';
function maybeRedrawIcon(){const k=Math.round(B.w/B.cw*20)+','+Math.round(B.p/B.cp*20);if(k!==_iconKey){_iconKey=k;drawBrushIcon()}}
function drawBrushIcon(){if(!iconCtx)return;const x=iconCtx;
  x.setTransform(ICON_DPR,0,0,ICON_DPR,0,0);x.clearRect(0,0,ICON_W,ICON_H);
  const cx=ICON_W/2,P=NAP.P,S=NAP.S,F=NAP.F,Z=NAP.Z;
  const wl=clamp(B.w/B.cw,0,1),pl=clamp(B.p/B.cp,0,1);
  x.fillStyle='rgba(31,28,24,.5)';x.fillRect(cx-1.1,0,2.2,14);          // handle
  x.fillStyle='rgba(31,28,24,.78)';x.fillRect(cx-2.3,13,4.6,3);          // ferrule
  const top=16,len=21;
  const base=3.6*(1+0.45*F),belly=base*(1.1+0.3*S);
  const tipHalf=Math.max(0.2,base*(0.22*(1-P)+0.95*S+0.55*F+0.3*Z));
  const tipY=top+len*(1-0.12*S-0.15*F);

  if(wl>0.02){x.fillStyle=`rgba(63,106,143,${(0.10+0.32*wl).toFixed(3)})`;x.beginPath();x.moveTo(cx-base,top);
    x.quadraticCurveTo(cx-belly-1,top+len*0.5,cx-tipHalf,tipY);x.lineTo(cx+tipHalf,tipY);
    x.quadraticCurveTo(cx+belly+1,top+len*0.5,cx+base,top);x.closePath();x.fill()}
  const r=Math.round(inkR*255),g=Math.round(inkG*255),b=Math.round(inkB*255);
  x.strokeStyle=`rgba(${r},${g},${b},${(0.3+0.65*pl).toFixed(3)})`;x.lineWidth=0.65;x.lineCap='round';
  const n=9;

(function setupNapkin(){const nap=document.getElementById('napkin');let napHoldTimer=null,napHolding=false,napActive=false,napMoved=false,lastNapX=0,lastNapY=0,lastCX=0,lastCY=0,activeZone='napBoth',napLastT=0,napStopT=null,pressK=1,pressRaf=0,pressLast=0;

  const previous=trayMode;
  trayMode=m==='full'?'full':'closed';
  const visible=trayMode==='full';
  tray.classList.toggle('visible',visible);
  trayTab.textContent=visible?'⌄':'⌃';
  trayTab.classList.toggle('on',visible);
  if(!visible){
    clearTimeout(trayTimer);if(holding)stopHold();
    closeBrushOptions();closeSettings();
    if(previous!=='closed')fadeNapkinInk(0.18);
  }else keepOpen();
}
function openTray(){setTrayMode('full')}
function openMaterialTray(){openTray()}
function openNapkinOnly(){openTray()}
function closeTray(){setTrayMode('closed')}
trayTab.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setTrayMode(trayMode==='full'?'closed':'full')});
trayTab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setTrayMode(trayMode==='full'?'closed':'full')}});
document.getElementById('grab').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();closeTray()});
function openBrushOptions(){openTray();closeSettings();brushOptions.classList.add('open')}
function toggleSettings(){if(trayMode!=='full')openTray();closeBrushOptions();const on=!settingsPanel.classList.contains('open');settingsPanel.classList.toggle('open',on);settingsBtn.classList.toggle('on',on);tray.classList.toggle('settings-open',on)}
settingsBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleSettings()});

// A quick touch advances the brush form. A deliberate hold opens its full controls.
const BRUSH_STYLES=['round','point','side','rake','smudge'];
const BRUSH_SYMBOLS={round:'丸',point:'尖',side:'平',rake:'裂',smudge:'滲'};
function showBrushFlash(style){const el=document.getElementById('brushFlash');el.textContent=BRUSH_SYMBOLS[style]||'丸';el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(el._hide);el._hide=setTimeout(()=>el.classList.remove('show'),1050)}
function selectBrushStyle(style,flash){if(!BRUSH_STYLES.includes(style))return;brushStyle=style;
  document.querySelectorAll('#brushRow .bstyle').forEach(s=>s.classList.toggle('active',s.dataset.style===style));
  send({t:'set',v:{style}});drawBrushIcon();if(flash)showBrushFlash(style)}
function cycleBrushStyle(){const i=BRUSH_STYLES.indexOf(brushStyle);selectBrushStyle(BRUSH_STYLES[(i+1)%BRUSH_STYLES.length],true)}
(function bindBrushHandle(){const el=document.getElementById('brushHandle');let timer=0,longFired=false,startX=0,startY=0,pid=null;
  el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();longFired=false;startX=e.clientX;startY=e.clientY;pid=e.pointerId;
    try{el.setPointerCapture(pid)}catch(_){}el.classList.add('pressed');
    timer=setTimeout(()=>{longFired=true;openBrushOptions();el.classList.remove('pressed')},480)});
  el.addEventListener('pointermove',e=>{if(pid!==e.pointerId)return;if(Math.hypot(e.clientX-startX,e.clientY-startY)>12){clearTimeout(timer);timer=0;el.classList.remove('pressed')}});
  const end=e=>{if(e&&e.stopPropagation)e.stopPropagation();clearTimeout(timer);if(!longFired&&timer){cycleBrushStyle()}el.classList.remove('pressed');pid=null};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',e=>{e.stopPropagation();clearTimeout(timer);el.classList.remove('pressed');pid=null});el.addEventListener('lostpointercapture',()=>{clearTimeout(timer);el.classList.remove('pressed');pid=null});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cycleBrushStyle()}})
})();

// ═══ BOOK-BASED PRACTICE GUIDE ═══
const STUDIES=[
  {title:'Condition the brush',body:'The brush carries two separate loads: pigment and water. Hold 墨 to replenish pigment or 水 to replenish water. The cloth has three working lanes: the left lane removes pigment, the middle removes both loads together, and the right lane removes water. Removing pigment leaves a paler wash; removing water concentrates the remaining ink. The cloth keeps its marks as you work.',prompt:'Try a loaded brush on the cloth. Pull through the left lane for a lighter wash, or the right lane for denser black. A straight downward pull reforms the point; a sideways pull flattens it; a zigzag frays it; pressing or pushing splays the hairs. Tap the brush to cycle its form, or hold it for the full options.'},
  {title:'The first line',body:'Begin with a vertical, controlled brush and learn the difference between the tip and the body of the bristles. A narrow line comes from the tip; a broader mark comes when more of the brush meets the paper. Pressure, speed, and the amount of liquid each change the line.',prompt:'Choose TIP for a fine line, then BODY or FLAT for a wider one. Draw one deliberate stroke with a clear beginning and a lifted ending. Do not trace over it to repair it.'},
  {title:'Orchid: one breath',body:'The orchid exercise is a curved leaf drawn in a swift, continuous motion. Alternate pressure and speed so the leaf swells and narrows. The next leaves cross the first ones; those crossings create a counterbalance and open spaces within the plant.',prompt:'Choose BODY or TIP. Draw one long curve, changing pressure as it travels. Add two or three crossing curves, then stop before the base becomes tangled. Let the paper remain visible between leaves.'},
  {title:'Bamboo: growth and restraint',body:'A bamboo stem is built from decisive segments. Press the brush body into the paper, move with the direction of growth, and release pressure at the end. Each segment has a beginning and an ending. Nodes are firm, distinct accents; branches are drier and lighter; leaves are quick sweeping marks.',prompt:'Choose FLAT for a broad stem, TIP for a node, then FRAY for dry branch texture. Give each segment its own start and finish. Vary the tone and leave space around the leaves.'},
  {title:'Plum: strength beside delicacy',body:'The plum branch is strong, bent, and irregular. Use an angled, loaded brush for the larger branches. Twigs use a drier tip and a quicker, even pull. Blossoms should not overwhelm the branch: their softer forms gain force from the contrast. The book also shows how rotating the brush handle changes petal shape.',prompt:'Start with one broad, bending branch. Add a few finer twigs with a lighter brush load. Reserve small open areas for blossoms before adding them. With a stylus that reports barrel rotation, twist it while using FLAT to turn the brush footprint during a stroke.'},
  {title:'Landscape: let the white work',body:'In a landscape, depth can be carried by differences in scale, tone, and placement rather than by outlining everything. Nearby forms are stronger; distant forms become smaller and lighter. Snow is the untouched paper. Reflections repeat and soften the shore and its forms.',prompt:'Paint only a few dark forms, then look at the untouched paper as part of the scene. Try a second, lighter distance. For snow or water, protect the blank areas instead of filling them.'},
  {title:'Color: a supporting voice',body:'Ink remains the principal material. Color should not sit on top as a separate opaque layer; it should share the spatial quality of the ink and enhance it. Some subjects begin with a light color wash, while strong landscape structures may be painted in ink first and colored after the paper has dried.',prompt:'Switch to the mineral palette only when the subject needs it. Keep the wash restrained, let ink carry the structure, and avoid using color to explain every form.'}
];

// ═══ DRAWING ═══
let drawing=false,lastGX=0,lastGY=0;
function clientToGrid(cx,cy){
  const r=canvas.getBoundingClientRect();
  // object-fit:contain keeps the original paper proportions if iOS changes the
  // viewport height or the phone rotates. Map touches to the fitted paper, not
  // the surrounding letterbox area.
  const scale=Math.min(r.width/W_PX,r.height/H_PX);
  const drawW=W_PX*scale,drawH=H_PX*scale;
  const left=r.left+(r.width-drawW)*0.5,top=r.top+(r.height-drawH)*0.5;
  return[(cx-left)/drawW*NX,(cy-top)/drawH*NY];
}
function getPressure(e){if(e.pressure>0&&e.pressure!==1)return e.pressure;if(e.width&&e.width>1)return Math.min(1,Math.max(0.08,(e.width-8)/42));return 0.5}
function getLiveRadius(e){const contact=Math.max(e.width||0,e.height||0);lastContact=contact;if(contact>20){const t=Math.min(1,Math.max(0,(contact-30)/130));return brushRange[0]+t*(brushRange[1]-brushRange[0])}return brushRange[0]+0.3*(brushRange[1]-brushRange[0])}
function getBrushRoll(e){return Number.isFinite(e.twist)?e.twist*Math.PI/180:0}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const[gx,gy]=clientToGrid(e.clientX,e.clientY);if(gx<0||gy<0||gx>=NX||gy>=NY)return;canvas.setPointerCapture(e.pointerId);drawing=true;lastGX=gx;lastGY=gy;brushRadius=getLiveRadius(e);
  send({t:'down',x:gx,y:gy,pr:getPressure(e),r:brushRadius,roll:getBrushRoll(e),ts:e.timeStamp||performance.now(),nap:napOut()})});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;let samples=[e];
  try{if(typeof e.getCoalescedEvents==='function'){const co=e.getCoalescedEvents();if(co&&co.length)samples=co}}catch(_){}
  const points=[];
  for(const pe of samples){const[gx0,gy0]=clientToGrid(pe.clientX,pe.clientY);const gx=Math.max(0,Math.min(NX-1,gx0)),gy=Math.max(0,Math.min(NY-1,gy0));
    const r=getLiveRadius(pe),pr=getPressure(pe);if(brushStyle!=='smudge')wearNap(Math.hypot(gx-lastGX,gy-lastGY));
    points.push({x:gx,y:gy,pr,r,roll:getBrushRoll(pe),ts:pe.timeStamp||performance.now(),nap:napOut()});lastGX=gx;lastGY=gy;brushRadius=r;
  }
  if(points.length===1)send({t:'move',...points[0]});else if(points.length>1)send({t:'moveBatch',points});
});
canvas.addEventListener('pointerup',e=>{if(drawing)send({t:'up'});drawing=false;try{canvas.releasePointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointercancel',()=>{if(drawing)send({t:'cancel'});drawing=false});
canvas.addEventListener('lostpointercapture',()=>{if(drawing)send({t:'cancel'});drawing=false});

function palettesFromDom(){const out={};
  document.querySelectorAll('.palPage').forEach(pg=>{const n=pg.dataset.pal;out[n]=[];
    pg.querySelectorAll('.swatch').forEach(sw=>out[n].push([parseFloat(sw.dataset.r),parseFloat(sw.dataset.g),parseFloat(sw.dataset.b)]))});
  return out}
function importJsonLayer(jsonStr){let data;try{data=JSON.parse(jsonStr)}catch(e){alert('JSON parse error: '+e.message);return}
  send({t:'json',data,palettes:palettesFromDom()})}
(function buildJsonUI(){const btn=document.getElementById('jsonBtn');const fileIn=document.createElement('input');fileIn.type='file';fileIn.accept='.json,application/json';fileIn.style.display='none';fileIn.addEventListener('change',()=>{const f=fileIn.files[0];if(!f)return;const reader=new FileReader();reader.onload=e=>importJsonLayer(e.target.result);reader.readAsText(f);fileIn.value=''});let pressT=null,longFired=false;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();longFired=false;keepOpen();
   clearTimeout(pressT);pressT=setTimeout(()=>{longFired=true;const txt=prompt('Paste JSON layer:');if(txt)importJsonLayer(txt)},600)});
 btn.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();clearTimeout(pressT);if(!longFired)fileIn.click();keepOpen()});
 btn.addEventListener('pointercancel',()=>clearTimeout(pressT));document.body.appendChild(fileIn)})();

// ═══ v5 CHARACTER CONTROLS ═══
(function bindCharacter(){
  const row=document.getElementById('charRow'),tog=document.getElementById('charToggle');
  tog.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();
    row.classList.toggle('open');tog.classList.toggle('on',row.classList.contains('open'));tog.setAttribute('aria-pressed',String(row.classList.contains('open')));keepOpen()});
  function link(id,vid,key,scale){
    const el=document.getElementById(id),out=document.getElementById(vid);
    if(!el||!out)return;
    const apply=()=>{const v=Number(el.value);out.textContent=v;send({t:'set',v:{[key]:v/scale}})};
    el.addEventListener('input',apply);
    el.addEventListener('pointerdown',e=>{e.stopPropagation();keepOpen()});
    el.addEventListener('pointerup',()=>schedClose(9986000));
    apply();
  }
  // Chatter / Grain are ceilings reached at full dryness.
  link('sChat','vChat','chat',100);
  link('sGrain','vGrain','grain',100);
  // Heel rides the brush load (see heelLoadK in the engine).
  link('sHeel','vHeel','heel',100);
  // Wet / Bloom are coupling gains: how far a fully wet brush travels toward v3.
  link('sWet','vWet','wet',100);
  link('sBloom','vBloom','bloom',100);
  // v7-ink: Tip is bokashi strength, 0 = off.
  link('sTip','vTip','tip',100);
  // v7-ink: Feather is wet-on-wet pigment diffusion, 0 = off.
  link('sFeather','vFeather','feather',100);
  // v7-ink: Wabi is brush irregularity, 0 = the old tidy v7 behaviour.
  link('sWabi','vWabi','wabi',100);
  // v7 splash: Spray scales flick energy into the breakup physics, Height is
  // SPLAT's drop height (fall impact → rounder stains and crown satellites).
  link('sDrop','vDrop','drop',100);
  link('sSpray','vSpray','spray',100);
  link('sHeight','vHeight','height',1);
})();

<script>
/* ===== SUMI ENHANCEMENTS: visual/tactile layer only ===== */
(()=>{
  const base = document.getElementById('canvas');
  const fx = document.getElementById('fxCanvas');
  if(!base || !fx) return;
  const ctx = fx.getContext('2d', {alpha:true});
  let dpr=1, w=1, h=1;
  let pointer={x:0,y:0,active:false,pressure:0.5,radius:8};
  let pulse=0, raf=0, running=false;

  const liveMode=document.getElementById('liveMode');
  const liveLoad=document.getElementById('liveLoad');
  const liveWater=document.getElementById('liveWater');
  const liveTouch=document.getElementById('liveTouch');
  const liveStatus=document.getElementById('liveStatus');

  function resizeFX(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    w=innerWidth; h=innerHeight;
    fx.width=Math.max(1,Math.round(w*dpr));
    fx.height=Math.max(1,Math.round(h*dpr));
    fx.style.width=w+'px'; fx.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  let rzT=null;
  addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resizeFX,200)},{passive:true});
  resizeFX();

  function draw(){
    ctx.clearRect(0,0,w,h);
    if(pointer.active){
      const r=Math.max(5,Math.min(120,pointer.radius));
      const alpha=.18 + pointer.pressure*.16;
      ctx.beginPath();
      ctx.arc(pointer.x,pointer.y,r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(236,234,210,${alpha})`;
      ctx.lineWidth=1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(pointer.x,pointer.y,2.1,0,Math.PI*2);
      ctx.fillStyle=`rgba(145,185,161,${.28+pointer.pressure*.25})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(pointer.x,pointer.y,r*.72,0,Math.PI*2);
      ctx.strokeStyle='rgba(236,234,210,.045)';
      ctx.stroke();
    }
    if(pulse>0){
      pulse*=.86;
      if(pulse>.002){
        const r=8+(1-pulse)*34;
        ctx.beginPath();
        ctx.arc(pointer.x,pointer.y,r,0,Math.PI*2);
        ctx.strokeStyle=`rgba(145,185,161,${pulse*.22})`;
        ctx.stroke();
      }else pulse=0;
    }
    if(pointer.active||pulse>0){raf=requestAnimationFrame(draw)}
    else{running=false;raf=0;ctx.clearRect(0,0,w,h)}
  }
  function wake(){if(!running){running=true;raf=requestAnimationFrame(draw)}}

  function pos(e){
    const t=e.touches&&e.touches[0];
    const x=t?t.clientX:e.clientX, y=t?t.clientY:e.clientY;
    if(Number.isFinite(x)&&Number.isFinite(y)){
      pointer.x=x; pointer.y=y;
    }
  }
  function down(e){
    pos(e);
    pointer.active=true;
    pointer.pressure=(e.pressure>0?e.pressure:.5);
    pointer.radius=Math.max(8,Math.max(e.width||0,e.height||0));
    liveStatus?.classList.add('pressed');
    wake();
  }
  function move(e){
    pos(e);
    if(e.pressure>0) pointer.pressure=e.pressure;
    const c=Math.max(e.width||0,e.height||0);
    if(c>0) pointer.radius=Math.max(8,c);
  }
  function up(e){
    pos(e);
    pointer.active=false;
    pulse=1;
    liveStatus?.classList.remove('pressed');
    wake();
  }
  base.addEventListener('pointerdown',down,{passive:true});
  base.addEventListener('pointermove',move,{passive:true});
  base.addEventListener('pointerup',up,{passive:true});
  base.addEventListener('pointercancel',up,{passive:true});
  base.addEventListener('pointerleave',()=>{pointer.active=false;wake()},{passive:true});

  let pm='',pl='',pw='',pt='';
  function pct(v){return Number.isFinite(v)?Math.max(0,Math.min(100,v*100)).toFixed(0)+'%':'—'}
  const showStatus=/[?&]debug/.test(location.search);
  if(showStatus&&liveStatus)liveStatus.classList.add('on');
  if(showStatus)setInterval(()=>{
    const st=window.SUMI&&window.SUMI.state?window.SUMI.state():null;
    if(!st)return;
    const m=st.tray?'PALETTE':'READY';
    const l='INK '+pct(st.ink), wq='WATER '+pct(st.water);
    const t='C'+(st.contact||0).toFixed(0)+' R'+(st.radius||0).toFixed(0);
    if(liveMode&&m!==pm){liveMode.textContent=m;pm=m}
    if(liveLoad&&l!==pl){liveLoad.textContent=l;pl=l}
    if(liveWater&&wq!==pw){liveWater.textContent=wq;pw=wq}
    if(liveTouch&&t!==pt){liveTouch.textContent=t;pt=t}
  },250);
})();
</script>
